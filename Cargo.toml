[package]
name = "cargo-generate-spk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Martin Takáč <tacoberu@gmail.com>"]
description = "Generate a Synology DiskStation package (.spk) from Cargo projects"
readme = "README.md"
keywords = ["synology", "spk", "package", "cargo", "subcommand"]
categories = [
    "command-line-utilities",
    "development-tools::cargo-plugins",
    "development-tools::build-utils",
]
exclude = ["examples/"]
homepage = "https://github.com/tacoberu/cargo-generate-spk"
repository = "https://github.com/tacoberu/cargo-generate-spk"

[dependencies]
cargo_toml = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
glob = "0.3"
tar = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
